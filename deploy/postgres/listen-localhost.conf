# Drop into PostgreSQL's conf.d (path depends on the distro package).
# Postgres must not listen on a public address (docs/deployment.md).

listen_addresses = 'localhost'
port = 5432

# pg_cron is required for auto_submit_expired / rank_dirty_tests.
# After changing shared_preload_libraries, restart PostgreSQL (not reload).
shared_preload_libraries = 'pg_cron'

# pg_cron.database_name is the application database name chosen at provision
# (template default: medverse). Uncomment and set on the host:
# cron.database_name = 'medverse'
